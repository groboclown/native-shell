[package]
name = "native-shell"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.41"
clap = { version = "4.6.1", features = ["derive"] }
env_logger = "0.11.8"
libc = "0.2.174"
log = "0.4.27"
regress = "0.10.3"
rustfmt-wrapper = "0.2.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"
signal-hook = "0.4.4"
termion = "4.0.5"
textwrap = "0.16.2"
ureq = "3.1.4"
users = "0.11.0"
zip = "4.6.0"

[target.'cfg(target_os = "windows")'.dependencies]
winapi = "0.3.9"

[build-dependencies]
rustfmt-wrapper = "0.2.1"
yaml2json-rs = "0.4.0"
zip = "4.6.0"

# Need a < 1 version of schemars to work with the typify crate.
schemars = "0.8"

serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"
typify = "0.4.2"
