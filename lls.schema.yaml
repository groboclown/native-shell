    additionalProperties: false
    properties:
      source:
        "$ref": "#/$defs/Source"
      kind:
        const: range-boolean-list
      list:
        "$ref": "#/$defs/ComputedBooleanListValue"
      start:
        "$ref": "#/$defs/ComputedNumberValue"
      count:
        "$ref": "#/$defs/ComputedNumberValue"
      end:
        "$ref": "#/$defs/ComputedNumberValue"
  ConstantBooleanListValue:
    title: Constant Boolean List Value
    description: A constant boolean list value.  Can include expanding a sub-list within the list.
    type: object
    required:
      - source
      - kind
      - value
    additionalProperties: false
    properties:
      source:
        "$ref": "#/$defs/Source"
      kind:
        const: constant-boolean-list
      value:
        type: array
        description: The constant boolean list value.
        items:
          oneOf:
            - "$ref": "#/$defs/ComputedBooleanValue"
            - "$ref": "#/$defs/ComputedBooleanListValue"

  # -------------------------------------------------------------------
  # String map values
  ComputedStringMapValue:
    title: Computed Map Value
    description: A computed map value.
    oneOf:
      - "$ref": "#/$defs/LookupStringMapValue"
      - "$ref": "#/$defs/UnionStringMapValue"
      - "$ref": "#/$defs/StringMapListIndexValue"
      - "$ref": "#/$defs/ConstantStringMapValue"
      # TODO include 'contains-key-string-map' and 'contains-value-string-map'
  LookupStringMapValue:
    title: Lookup String Map Value
    description: A string map value that is looked up from a job's state.
    type: object
