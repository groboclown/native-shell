        "$ref": "#/$defs/ComputedNumberValue"
      end:
        "$ref": "#/$defs/ComputedNumberValue"
  ConstantNumberListValue:
    title: Constant Number List Value
    description: A constant number list value.  Can include expanding a sub-list within the list.
    type: object
    required:
      - source
      - kind
      - value
    additionalProperties: false
    properties:
      source:
        "$ref": "#/$defs/Source"
      kind:
        const: constant-number-list
      value:
        type: array
        description: The constant number list value.
        items:
          oneOf:
            - "$ref": "#/$defs/ComputedNumberValue"
            - "$ref": "#/$defs/ComputedNumberListValue"

  # -------------------------------------------------------------------
  # Boolean list values
  ComputedBooleanListValue:
    title: Computed List Value
    description: A computed list value.
    oneOf:
      - "$ref": "#/$defs/LookupBooleanListValue"
