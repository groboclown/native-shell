        "$ref": "#/$defs/JobRef"
      name:
        "$ref": "#/$defs/ParamName"
  UnionStringMapValue:
    title: Union String Map Value
    description: A string map value that is the union of multiple string map values.
    type: object
    required:
      - source
      - kind
      - values
    additionalProperties: false
    properties:
      source:
        "$ref": "#/$defs/Source"
      kind:
        const: union-string-map
      values:
        type: array
        description: The values to union.
        items:
          "$ref": "#/$defs/ComputedStringMapValue"
  StringMapListIndexValue:
    title: String Map List Index Value
    description: >
      Extracts a string-map from a string-map-list value at a given index.
      This includes a 'default' in case the index is not present.
    required:
      - source
      - kind
      - list
      - index
      - default
    additionalProperties: false
    properties:
      source:
        "$ref": "#/$defs/Source"
      kind:
        const: list-index-string
      list:
        "$ref": "#/$defs/ComputedStringMapListValue"
      index:
        "$ref": "#/$defs/ComputedNumberValue"
      default:
        "$ref": "#/$defs/ComputedStringMapValue"
  ConstantStringMapValue:
    title: Constant String Map Value
    description: >
      A constant string map value.  Can include expanding a sub-map within the map.
      This also includes a 'null' value for the key to allow blanking out values if used in a union.
    type: object
    required:
      - source
      - kind
      - value
    additionalProperties: false
    properties:
      source:
        "$ref": "#/$defs/Source"
      kind:
        const: constant-string-map
      value:
        type: object
        description: The constant string map value.
        minItems: 0
        maxItems: 10000
        patternProperties:
          ".*":
            oneOf:
              - "$ref": "#/$defs/ComputedStringValue"
              - type: "null"

