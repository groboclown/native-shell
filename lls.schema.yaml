  # -------------------------------------------------------------------
  # String-List Values
  ComputedStringListValue:
    title: Computed List Value
    description: A computed list value.
    oneOf:
      - "$ref": "#/$defs/LookupStringListValue"
      - "$ref": "#/$defs/SplitStringValue"
      - "$ref": "#/$defs/RangeStringListValue"
      - "$ref": "#/$defs/ConstantStringListValue"
      # TODO include 'contains-string'
      # Note: operations like 'sort' and 'unique' belong in jobs.
  LookupStringListValue:
    title: Lookup String List Value
    description: A string list value that is looked up from a node's state.
    type: object
    required:
      - source
      - kind
      - job
      - name
    additionalProperties: false
    properties:
      source:
        "$ref": "#/$defs/Source"
      kind:
        const: lookup-state-string-list
      job:
        "$ref": "#/$defs/JobRef"
      name:
        "$ref": "#/$defs/ParamName"
  SplitStringValue:
    title: Split-String Value
    description: Turns a string into a string array, splitting items by a specific string.
    type: object
    required:
      - source
      - kind
      - value
      - separator
    additionalProperties: false
    properties:
      source:
        "$ref": "#/$defs/Source"
      kind:
        const: split-string
      value:
        "$ref": "#/$defs/ComputedStringValue"
      separator:
        "$ref": "#/$defs/ComputedStringValue"
      maximumSplits:
        "$ref": "#/$defs/ComputedNumberValue"
  RangeStringListValue:
    title: Range String List Value
    description: >
      Selects a sub-sequence of values from an array.  If the 'count' or 'end'
      fields are not given, then it defaults to the end of the list.  If the
      'start' field is not given, then it defaults to 0.
    type: object
    required:
      - source
      - kind
      - list
    additionalProperties: false
    properties:
      source:
        "$ref": "#/$defs/Source"
      kind:
        const: range-string-list
      list:
        "$ref": "#/$defs/ComputedStringListValue"
      start:
        "$ref": "#/$defs/ComputedNumberValue"
      count:
        "$ref": "#/$defs/ComputedNumberValue"
      end:
        "$ref": "#/$defs/ComputedNumberValue"
  ConstantStringListValue:
    title: Constant String List Value
    description: A constant string list value.  Can include expanding a sub-list within the list.
    type: object
    required:
      - source
      - kind
      - value
    additionalProperties: false
    properties:
      source:
        "$ref": "#/$defs/Source"
      kind:
        const: constant-string-list
      value:
        type: array
        description: The constant string list value.
        items:
          oneOf:
            - "$ref": "#/$defs/ComputedStringValue"
            - "$ref": "#/$defs/ComputedStringListValue"

  # -------------------------------------------------------------------
  # Number list values
  ComputedNumberListValue:
    title: Computed List Value
    description: A computed list value.
    oneOf:
      - "$ref": "#/$defs/LookupNumberListValue"
      - "$ref": "#/$defs/RangeNumberListValue"
