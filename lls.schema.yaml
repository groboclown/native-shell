# Construction:
#     Maintainers of this file need to follow several standards:
#       - Any item that relates to a place in a user script must include a 'source' element.
#       - Except for the most basic, self-describing values (like an integer parameter),
#         each item must include a title and description.
#       - Descriptions should use the '>' syntax to allow for multi-line text.
#       - If two properties share the same *purpose*, then they should use a '$ref' to that property.
#       - Properties of type 'string' must include a minLength and maxLength qualifier.
#       - Properties of type 'array' must include a minItems and maxItems qualifier.
#       - Properties of type 'integer' and 'float' must include a minValue and maxValue qualifier.
#       - Properties of type 'object' with 'patternProperties' must include a minItems and maxItems.
#       - Properties of type 'object' with 'properties' must include required qualifier, and
#         define 'additionalProperties: false'.
#       - Properties use the ordering:
#           $ref
#           title
#           description
#           type
#           const
#           default
#           required
#           additionalProperties
#           minLength
#           maxLength
#           minItems
#           maxItems
#           items
#           properties
#           patternProperties

"$schema": "https://json-schema.org/draft/2020-12/schema"
#"$schema": "https://json-schema.org/draft/2019-09/schema"
#"$schema": "http://json-schema.org/draft-07/schema#"
"$spdx-license": MIT
title: Native Shell Low-Level Script Schema
description: >
  The low-level script schema for a Native Shell.  It describes in the most basic
  way the elements necessary to build the code that can compile into the shell program.
type: object
required:
  - schema-version
  - meta
  - commands
  - threads
  - jobs
  # TODO add in the argument+env state object.
  # TODO add in a maximum runtime.  This could be in the magitude of centuries.
additionalProperties: false

# ===================================================================
# ===================================================================
# ===================================================================
# Top-Level Script Elements
properties:
  "schema-version":
    title: Schema Version
    description: >
      The version of the schema for this LLS.  This is used to ensure compatibility with the parser and runtime.
    const: "1.0.0"
    type: string

  meta:
    title: Metadata
    description: Information about the script.
    type: object
    required:
      - name
      - version
      - source
    additionalProperties: false
    properties:
      name:
        title: Script Name
        description: The script name.
        type: string
        minLength: 1
        maxLength: 200
      version:
        title: Script Version
        description: The version of the script.
        type: string
        minLength: 1
        maxLength: 100
      source:
        "$ref": "#/$defs/Source"
      authors:
        title: Script Author List
        description: All authors of the script, if the authors desire to include it.
        type: array
        minItems: 0
        maxItems: 200
        items:
          title: Script Author
          description: An author of the script.
          type: string
          minLength: 1
          maxLength: 200
      license:
        title: Script License
        description: The SPDX description of the script's license.
        type: object
        required:
          - spdx-id
        additionalProperties: false
        properties:
          spdx-id:
            title: SPDX ID
            description: The formal SPDX identifier string for this license.
            type: string
            minLength: 1
            maxLength: 1000
          copyright:
            title: Copyright
            description: >
              The copyright description that accompanies the license type.  This usually
              relates to the first line of the license text.
            type: string
      description:
        "$ref": "#/$defs/UserHelp"

  commands:
    title: Commands
    description: >
      Available sub-commands to execute.

      If a script has just one command, then the script will run as though it has no sub-commands,
      and the one present will run as the command.

      If the script has multiple commands, and one is named 'default', then that will run if the
      user provides no sub-command at the CLI.

      If the script has multiple commands ano none are named 'default', then the user must
      explicitly declare the sub-command to run.
    type: object
    minItems: 1
    maxItems: 10000
    patternProperties:
      ".*":
        "$ref": "#/$defs/Command"
  threads:
    title: Threads
    description: >
      All sequential instructions for execution.  These provide a form of instruction set.
    type: object
    minItems: 1
    maxItems: 10000
    patternProperties:
      ".*":
        "$ref": "#/$defs/Thread"
  jobs:
    title: Job Collection
    description: The set of all configured actions to take during execution.
    type: object
    minItems: 0
    maxItems: 10000
    patternProperties:
      ".*":
        "$ref": "#/$defs/Job"

# ===================================================================
# ===================================================================
# ===================================================================
# Shared Definitions

"$defs":
  # ===================================================================
  # Simple and Common Types
  Source:
    title: Source
    description: The source from the script.  Every object should include one.
    type: object
    required:
      - file
    additionalProperties: false
    properties:
      file:
        title: File
        description: The file where the node is defined.
        type: string
        minLength: 1
        maxLength: 10000
      line:
        title: Line
        description: The line number where the node is defined.
        type: integer
        minValue: 0
        maxValue: 4294967295
      column:
        title: Column
        description: The column number where the node is defined.
        type: integer
        minValue: 0
        maxValue: 4294967295
      text:
        title: Text
        description: >
          The script's code.  If present, allows better error reporting by
          showing the related script text.
        type: string
        minLength: 0
        maxLength: 4294967295
  JobRef:
    title: JobRef
    description: Reference to a job.  It must reference one of the keys in the "job" collection.
    type: string
    minLength: 1
    maxLength: 100
  ThreadRef:
    title: JobRef
    description: Reference to a thread.  It must reference one of the keys in the "thread" collection.
    type: string
    minLength: 1
    maxLength: 100
  EventRef:
    title: EventRef
    description: >
      Reference to a named event.  Named events exist within the script, and some modules have expectations for
      certain kinds of events.  These must all align, especially with the payload kind (either a Message (string)
      or Signal (number)).
    type: string
    minLength: 1
    maxLength: 100
  EventPayloadMessage:
    title: Event Payload Message
    description: The text payload for a message kind of event.
    type: string
    minLength: 0
    maxLength: 10000
  EventPayloadSignal:
    title: Event Payload Signal
    description: The number payload for a signal kind of event.
    type: integer
    minValue: -32768
    maxValue: 32767
  ExitCode:
    description: The script exit code.
    type: integer
    minValue: -32768
    maxValue: 32767
  StreamName:
    title: StreamName
    description: >
      A module's named stream identifier.
    type: string
    minLength: 1
    maxLength: 100
  FileDescriptor:
    title: File Descriptor
    description: >
      A numeric reference to a stream, usually corresponding to the inputs and outputs for
      a program.
    type: integer
    minValue: 0
    maxValue: 65535
  ConstString:
    title: Constant String Value
    description: >
      A constant string value declared within the script.  Used as an inline value.
    type: string
    minLength: 0
    maxLength: 65535
  ConstInt:
    title: Constant Integer Value
    description: >
      A constant integer value declared within the script.  Used as an inline value.
    type: integer
    minValue: -4294967296
    maxValue: 4294967295
  ConstFloat:
    title: Constant Floating Point Value
    description: >
      A constant floating point number declared within the script.  Used as an inline value.
    type: number
  ParamName:
    title: Parameter Name
    description: >
      A reference to a parameter or state placeholder.
    type: string
    minLength: 1
    maxLength: 100
    pattern: "^[a-zA-Z][a-zA-Z0-9$_]*$"
  UserHelp:
    title: User Help
    description: >
      Help text for the end-user.  Each line indicates a line of help text.
      Currently, only allows for a list of text for a single language.  Eventually may allow for
      multiple langauges.
    type: array
    minItems: 0
    maxItems: 1000
    items:
      type: string
      minLength: 0
      maxLength: 10000

  # ===================================================================
  # ===================================================================
  # Command-Related Definitions
  Command:
    title: Command
    description: >
      A command to run.

      It will use the module to construct the primary shell interface -
      argument + environment parsing and signal connection and so on.

      It will run the thread as the series of steps to take.
    type: object
    required:
      - source
      - definition
      - thread
    additionalProperties: false
    properties:
      source:
        "$ref": "#/$defs/Source"
      description:
        "$ref": "#/$defs/UserHelp"
      definition:
        "$ref": "#/$defs/CommandDef"
      thread:
        "$ref": "#/$defs/ThreadRef"

  CommandDef:
    title: Command Definition
    description: The construction parameters for the command.
    discriminator:
      propertyName: kind
      mapping:
        module: "#/$defs/ModuleJob"
        macro: "#/$defs/MacroJob"
    oneOf:
      - "$ref": "#/$defs/ModuleJob"
      - "$ref": "#/$defs/MacroJob"


  # ===================================================================
  # ===================================================================
  # Thread-Related Definitions

  Thread:
    title: Thread
    description: A sequence of steps.  The name comes from the property key in the owning object.
    type: object
    required:
      - source
      - steps
    additionalProperties: false
    properties:
      source:
        "$ref": "#/$defs/Source"
      steps:
        title: Step List
        description: A list of ordered steps that run sequentially.
        type: array
        minItems: 1
        maxItems: 10000
        items:
          "$ref": "#/$defs/Step"

  Step:
    type: object
    title: Step
    description: A minimal unit of work to perform, which ties events and jobs together.
    required:
      - source
      - name
      - run
    additionalProperties: false
    properties:
      name:
        type: string
        description: The name of the step.  Used only for debugging.
      source:
        "$ref": "#/$defs/Source"
      run:
        "$ref": "#/$defs/StepTask"

  StepTask:
    title: Step Task
    description: A task to run during a step.
    discriminator:
      propertyName: kind
    oneOf:
      - title: Send Event
        description: Send an event to the event broker.  It has either a string message, or an integer code.
        type: object
        required:
          - kind
          - name
          - payload
        additionalProperties: false
        properties:
          kind:
            const: send-event
            type: string
          name:
            "$ref": "#/$defs/EventRef"
          payload:
            oneOf:
              - "$ref": "#/$defs/EventPayloadMessage"
              - "$ref": "#/$defs/EventPayloadSignal"
      - title: Wait For Event
        description: >
          Wait for something to send an event *after* this starts listening for events.
          It can optionally also wait for a matching payload.
        type: object
        required:
          - kind
          - name
        additionalProperties: false
        properties:
          kind:
            const: wait-for-event
            type: string
          name:
            "$ref": "#/$defs/EventRef"
          payload:
            oneOf:
              - "$ref": "#/$defs/EventPayloadMessage"
              - "$ref": "#/$defs/EventPayloadSignal"
      - title: Spawn Job
        description: >
          Requests the parallel execution of a job, either start
          it or restart it.  If it's currently running, this will do nothing.
        type: object
        required:
          - kind
          - job
        additionalProperties: false
        properties:
          kind:
            const: spawn-job
            type: string
          job:
            "$ref": "#/$defs/JobRef"
      - title: Wait For Job
        description: >
          Wait for a job to finish executing.  This will block until the
          job's execution exits.  If it has already completed, this will continue without waiting.
        type: object
        required:
          - kind
          - job
          - exit-behavior
        additionalProperties: false
        properties:
          kind:
            const: wait-for-job
            type: string
          job:
            "$ref": "#/$defs/JobRef"
          exit-behavior:
            "$ref": "#/$defs/ExitBehavior"
      - title: Spawn Thread
        description: >
          Requests the parallel execution of a thread, either start it
          or restart it.  If it's currently running, this will do nothing.
        type: object
        required:
          - kind
          - thread
        additionalProperties: false
        properties:
          kind:
            const: spawn-thread
            type: string
          thread:
            "$ref": "#/$defs/ThreadRef"
      - title: Wait For Thread
        description: >
          Wait for a thread to finish executing.  This will block until
          the thread's execution exits.  If it has already completed, this will continue without waiting.
        type: object
        required:
          - kind
          - thread
          - exit-behavior
        additionalProperties: false
        properties:
          kind:
            const: wait-for-thread
            type: string
          thread:
            "$ref": "#/$defs/ThreadRef"
          "exit-behavior":
            "$ref": "#/$defs/ExitBehavior"
      - title: Wait For All
        description: Wait for all the threads and jobs to finish.
        type: object
        required:
          - kind
          - jobs
          - threads
          - exit-behavior
        additionalProperties: false
        properties:
          kind:
            const: wait-for-all
            type: string
          jobs:
            type: array
            minItems: 0
            maxItems: 1000
            items:
              "$ref": "#/$defs/JobRef"
          threads:
            type: array
            minItems: 0
            maxItems: 1000
            items:
              "$ref": "#/$defs/ThreadRef"
          exit-behavior:
            "$ref": "#/$defs/ExitBehavior"
      - type: object
        title: Do Nothing
        description: Perform no action.
        required:
          - kind
        additionalProperties: false
        properties:
          kind:
            const: noop
            type: string

  ExitBehavior:
    title: Exit Behavior
    description: The action to take after waiting on a job or thread, based on how it stopped.
    type: object
    requires:
      - source
      - never-started
      - exit-code-behaviors
      - default-behavior
    additionalProperties: false
    properties:
      source:
        "$ref": "#/$defs/Source"
      never-started:
        "$ref": "#/$defs/OnExitBehavior"
      default-behavior:
        "$ref": "#/$defs/OnExitBehavior"
      exit-code-behaviors:
        type: array
        minItems: 0
        maxItems: 1000
        items:
          title: Exit Code Behavior
          description: >
            A behavior based on the exit code numeric value.
            At least one of 'min-code' or 'max-code' must be set.
          type: object
          required:
            - source
            - behavior
          additionalProperties: false
          properties:
            source:
              "$ref": "#/$defs/Source"
            behavior:
              "$ref": "#/$defs/OnExitBehavior"
            min-code:
              "$ref": "#/$defs/ExitCode"
            max-code:
              "$ref": "#/$defs/ExitCode"

  ScriptExit:
    title: Script Exit
    description: The script exit code and optional message.
    type: object
    requires:
      - source
      - code
    additionalProperties: false
    properties:
      source:
        "$ref": "#/$defs/Source"
      code:
        "$ref": "#/$defs/ExitCode"
      message:
        description: A descriptive message for the reason of the exit.
        type: string
        minLength: 0
        maxLength: 1000

  OnExitBehavior:
    title: On Exit Behavior
    description: Describes how to continue running the owning thread.
    discriminator:
      propertyName: kind
    oneOf:
      - title: Jump By
        type: object
        required:
          - kind
          - source
          - by
        additionalProperties: false
        properties:
          kind:
            const: jump
            type: string
          source:
            "$ref": "#/$defs/Source"
          by:
            type: integer
            minValue: -32768
            maxValue: 32767
      - title: Stop Thread
        type: object
        required:
          - kind
          - source
        additionalProperties: false
        properties:
          kind:
            const: stop-thread
            type: string
          source:
            "$ref": "#/$defs/Source"
          stop-with:
            "$ref": "#/$defs/ScriptExit"
      - title: Abort Script
        type: object
        required:
          - kind
          - source
        additionalProperties: false
        properties:
          kind:
            const: abort-script
            type: string
          source:
            "$ref": "#/$defs/Source"
          stop-with:
            "$ref": "#/$defs/ScriptExit"

  # ===================================================================
  # ===================================================================
  # Job-Related Definitions
  Job:
    # They must have a 'source' and 'rerunnable' value.
    discriminator:
      propertyName: kind
    oneOf:
      - "$ref": "#/$defs/ModuleJob"
      - "$ref": "#/$defs/StreamJob"
      - "$ref": "#/$defs/InlineJob"
      - "$ref": "#/$defs/MacroJob"

  ModuleJob:
    title: Module Job
    description: >
      A configuration for a pre-built execution path.  The shell comes with a set
      of pre-installed modules in the 'shell_lib/modules' path.
    type: object
    required:
      - kind
      - source
      - module
    discriminator:
      propertyName: kind
    additionalProperties: false
    properties:
      kind:
        const: module
        type: string
      source:
        "$ref": "#/$defs/Source"
      rerunnable:
        type: boolean
        default: true
      module:
        type: string
        description: The build implementation for the job.
        minLength: 1
        maxLength: 1000
      initial-parameters:
        "$ref": "#/$defs/InitialParameters"
      runtime-parameters:
        "$ref": "#/$defs/NamedParameters"
  StreamJob:
    title: Stream Job
    description: >
      A job that builds a stream connections between module jobs.
      Take care with this job.  While it may be possible to perform two stream jobs on the
      same jobs in parallel, that may lead to subtle bugs.
    type: object
    required:
      - kind
      - source
      - streams
    discriminator:
      propertyName: kind
    additionalProperties: false
    properties:
      kind:
        const: stream
        type: string
      source:
        "$ref": "#/$defs/Source"
      rerunnable:
        type: boolean
        default: true
      streams:
        type: array
        minLength: 1
        maxLength: 10000
        items:
          title: Stream
          description: A stream connecting the input from one job to the output of another job.
          type: object
          required:
            - source
            - from
            - to
          additionalProperties: false
          properties:
            source:
              "$ref": "#/$defs/Source"
            from:
              "$ref": "#/$defs/StreamLocation"
            to:
              "$ref": "#/$defs/StreamLocation"
  StreamLocation:
    discriminator:
      propertyName: kind
    oneOf:
      - title: File Descriptor Stream
        description: The file descriptor reference associated with the owning job.
        type: object
        required:
          - kind
          - source
          - job
          - fd
        additionalProperties: false
        properties:
          kind:
            const: fd
            type: string
          source:
            "$ref": "#/$defs/Source"
          job:
            "$ref": "#/$defs/JobRef"
          fd:
            $ref: "#/$defs/FileDescriptor"
      - title: Named Stream
        description: The named stream's name in the owning job.
        type: object
        required:
          - kind
          - source
          - job
          - name
        additionalProperties: false
        properties:
          kind:
            const: named
            type: string
          source:
            "$ref": "#/$defs/Source"
          job:
            "$ref": "#/$defs/JobRef"
          name:
            "$ref": "#/$defs/StreamName"
      - title: File
        description: >
          Use a file, either absolute or relative to the cwd, as the stream.
          The 'mode' only applies for targets; this sets the file's mode (read-write access).
          The 'mode' needs improvement, as this is very Unix-y.
        type: object
        required:
          - kind
          - source
          - filename
        additionalProperties: false
        properties:
          kind:
            const: file
            type: string
          source:
            "$ref": "#/$defs/Source"
          filename:
            "$ref": "#/$composite/ComputedStringValue"
          mode:
            "$ref": "#/$composite/ComputedNumberValue"
  InlineJob:
    title: Inline Job
    description: A job with explicit code that describes the execution behavior.
    type: object
    discriminator:
      propertyName: kind
    required:
      - kind
      - source
      - code
    additionalProperties: false
    properties:
      kind:
        const: inline
        type: string
      source:
        "$ref": "#/$defs/Source"
      rerunnable:
        type: boolean
        default: true
      code:
        type: string
        description: The source code to execute within the job.
        minLength: 0
        maxLength: 65535
      initial-parameters:
        "$ref": "#/$defs/InitialParameters"
      runtime-parameters:
        "$ref": "#/$defs/NamedParameters"
  MacroJob:
    title: Macro Job
    description: >
      A job built up by an alternative process rather than the built-in
      module system.  The builder uses the module system to construct the
      code that relies upon a pre-built library to provide the functionality,
      while a macro process constructs the functionality from scratch.  It
      also assembles the meta information rather than defining it statically.
    type: object
    discriminator:
      propertyName: kind
    required:
      - kind
      - source
      - macro
      - input
    additionalProperties: false
    properties:
      kind:
        const: macro
        type: string
      source:
        "$ref": "#/$defs/Source"
      rerunnable:
        type: boolean
        default: true
      macro:
        title: Macro
        description: The name of the macro to use to construct the job definition.
        type: string
        minLength: 1
        maxLength: 1000
      input:
        title: Input
        description: >
          Arbitrary structured data that the macro uses as input to perform its building
          operation.  The expected data must conform to the specific macro's requirements.

  # ===================================================================
  InitialParameters:
    type: object
    title: Initial Parameters
    description: The compile-time parameters for the node.  These parameters are static and help initialize the module.
    minItems: 0
    maxItems: 1000
    patternProperties:
      ".*":
        type: object
        title: Parameter
        description: A compile-time parameter for the node.
        required:
          - source
          - value
        additionalProperties: false
        properties:
          source:
            "$ref": "#/$defs/Source"
          value:
            "$ref": "#/$defs/InitialParameterValue"
  InitialParameterValue:
    discriminator:
      propertyName: kind
    oneOf:
      - title: Compile-Time String
        description: A constant string value.
        type: object
        required:
          - kind
          - source
          - value
        additionalProperties: false
        properties:
          kind:
            const: string
            type: string
          source:
            "$ref": "#/$defs/Source"
          value:
            "$ref": "#/$defs/ConstString"
      - title: Compile-Time Number
        description: A constant number value.
        type: object
        required:
          - kind
          - source
          - value
        additionalProperties: false
        properties:
          kind:
            const: number
            type: string
          source:
            "$ref": "#/$defs/Source"
          value:
            "$ref": "#/$defs/ConstFloat"
      - title: Compile-Time Boolean
        description: A constant boolean (true/false) value.
        type: object
        required:
          - kind
          - source
          - value
        additionalProperties: false
        properties:
          kind:
            const: boolean
            type: string
          source:
            "$ref": "#/$defs/Source"
          value:
            description: The constant boolean value.
            type: boolean
      - title: Compile-Time Null
        description: A constant null value.
        type: object
        required:
          - kind
          - source
        additionalProperties: false
        properties:
          kind:
            const: "null"
            type: string
          source:
            "$ref": "#/$defs/Source"
      - title: Compile-Time String List
        description: A constant string list value.
        type: object
        required:
          - source
          - kind
          - value
        additionalProperties: false
        properties:
          source:
            "$ref": "#/$defs/Source"
          kind:
            const: string-list
            type: string
          value:
            type: array
            minItems: 0
            maxItems: 1000
            items:
              "$ref": "#/$defs/ConstString"
      - title: Compile-Time Number List
        description: A constant number list value.
        type: object
        required:
          - source
          - kind
          - value
        additionalProperties: false
        properties:
          source:
            "$ref": "#/$defs/Source"
          kind:
            const: number-list
            type: string
          value:
            type: array
            minItems: 0
            maxItems: 1000
            items:
              "$ref": "#/$defs/ConstFloat"
      - title: Compile-Time Boolean List
        description: A constant boolean list value.
        type: object
        required:
          - source
          - kind
          - value
        additionalProperties: false
        properties:
          source:
            "$ref": "#/$defs/Source"
          kind:
            const: boolean-list
            type: string
          value:
            type: array
            minItems: 0
            maxItems: 1000
            items:
              type: boolean
      - title: Compile-Time String Map
        description: A constant string map value.
        type: object
        required:
          - source
          - kind
          - value
        additionalProperties: false
        properties:
          source:
            "$ref": "#/$defs/Source"
          kind:
            const: string-map
            type: string
          value:
            type: object
            minItems: 0
            maxItems: 1000
            patternProperties:
              ".*":
                "$ref": "#/$defs/ConstString"
      - title: Compile-Time Number Map
        description: A constant number map value.
        type: object
        required:
          - source
          - kind
          - value
        additionalProperties: false
        properties:
          source:
            "$ref": "#/$defs/Source"
          kind:
            const: number-map
            type: string
          value:
            type: object
            minItems: 0
            maxItems: 1000
            patternProperties:
              ".*":
                "$ref": "#/$defs/ConstFloat"
      - title: Compile-Time Boolean Map
        description: A constant boolean map value.
        type: object
        required:
          - source
          - kind
          - value
        additionalProperties: false
        properties:
          source:
            "$ref": "#/$defs/Source"
          kind:
            const: boolean-map
            type: string
          value:
            type: object
            minItems: 0
            maxItems: 1000
            patternProperties:
              ".*":
                type: boolean
      - title: Compile-Time String List Map
        description: A constant map to a string list.
        type: object
        required:
          - source
          - kind
          - value
        additionalProperties: false
        properties:
          source:
            "$ref": "#/$defs/Source"
          kind:
            const: string-list-map
            type: string
          value:
            type: object
            minItems: 0
            maxItems: 1000
            patternProperties:
              ".*":
                type: array
                minItems: 0
                maxItems: 1000
                items:
                  "$ref": "#/$defs/ConstString"
      - title: Compile-Time String Map List
        description: A constant list of string maps.
        type: object
        required:
          - source
          - kind
          - value
        additionalProperties: false
        properties:
          source:
            "$ref": "#/$defs/Source"
          kind:
            const: string-map-list
            type: string
          value:
            type: array
            minItems: 0
            maxItems: 1000
            items:
              type: object
              minItems: 0
              maxItems: 1000
              patternProperties:
                ".*":
                  "$ref": "#/$defs/ConstString"

  # ===================================================================
  # Runtime Parameters for Jobs
  NamedParameters:
    title: Named Parameters
    description: The parameters for the job.  The key is the parameter name.
    type: object
    patternProperties:
      "^.*$":
        type: object
        title: Action Parameter
        description: A parameter for the job. Must provide exactly one of a value or a value-array.
        required:
          - source
          - value
        additionalProperties: false
        properties:
          source:
            "$ref": "#/$defs/Source"
          value:
            "$ref": "#/$defs/ComputedValue"

  ComputedValue:
    title: Computed Value
    description: >
      A value that is computed at runtime.  This can be a constant value, a lookup from
      a job's state, or an array of values, or an operation on a list of values.
    discriminator:
      propertyName: kind
    oneOf:
      - "$ref": "#/$composite/ComputedStringValue"
      - "$ref": "#/$composite/ComputedNumberValue"
      - "$ref": "#/$composite/ComputedBooleanValue"
      - "$ref": "#/$composite/ComputedStringListValue"
      - "$ref": "#/$composite/ComputedNumberListValue"
      - "$ref": "#/$composite/ComputedBooleanListValue"
      - "$ref": "#/$composite/ComputedStringMapValue"
      - "$ref": "#/$composite/ComputedNumberMapValue"
      - "$ref": "#/$composite/ComputedBooleanMapValue"
      - "$ref": "#/$composite/ComputedStringListMapValue"
      - "$ref": "#/$composite/ComputedStringMapListValue"
      - "$ref": "#/$def/ComputedNullValue"

  ComputedNullValue:
    title: Computed Null Value
    description: >
      A null value.  Useful for optional values, or when a map entry construction requires removing an entry.
    type: object
    discriminator:
      propertyName: kind
    required:
      - source
      - kind
    additionalProperties: false
    properties:
      kind:
        const: "null"
        type: string
      source:
        "$ref": "#/$defs/Source"

  # -------------------------------------------------------------------
  # String-Related Values
  #   parent is in the "#/$composite/ComputedStringValue" section.
  LookupStringValue:
    title: Lookup String Value
    description: A string value that is looked up from a job's state.
    type: object
    discriminator:
      propertyName: kind
    required:
      - source
      - kind
      - job
      - name
    additionalProperties: false
    properties:
      source:
        "$ref": "#/$defs/Source"
      kind:
        const: lookup-string
        type: string
      job:
        "$ref": "#/defs/JobRef"
      name:
        "$ref": "#/defs/ParamName"
  ListIndexStringValue:
    title: List Indexed String Value
    description: >
      Extracts a single indexed string from a string list.  A default must be given, in case the index is out of bounds.
    type: object
    discriminator:
      propertyName: kind
    required:
      - source
      - kind
      - list
      - index
      - default
    additionalProperties: false
    properties:
      source:
        "$ref": "#/$defs/Source"
      kind:
        const: list-index-string
        type: string
      list:
        "$ref": "#/$composite/ComputedStringListValue"
      index:
        "$ref": "#/$composite/ComputedNumberValue"
      default:
        "$ref": "#/$composite/ComputedStringValue"
  MapKeyStringValue:
    title: Map Keyed String Value
    description: A key's string value from a map.  A default must be given, in case the key is not found.
    type: object
    discriminator:
      propertyName: kind
    required:
      - source
      - kind
      - map
      - key
      - default
    additionalProperties: false
    properties:
      source:
        "$ref": "#/$defs/Source"
      kind:
        const: map-key-string
        type: string
      map:
        "$ref": "#/$composite/ComputedStringMapValue"
      key:
        "$ref": "#/$composite/ComputedStringValue"
      default:
        "$ref": "#/$composite/ComputedStringValue"
  SubStringValue:
    title: Sub-String Value
    description: >
      Extract an internal part of another string.  The 'count' field
      cannot be used with 'end'.  If 'start' is not given, then it defaults to 0,
      and if 'end' or 'count' are not given, then it defaults to the end of the string.
    type: object
    discriminator:
      propertyName: kind
    required:
      - source
      - kind
      - value
    additionalProperties: false
    properties:
      source:
        "$ref": "#/$defs/Source"
      kind:
        const: substring
        type: string
      value:
        "$ref": "#/$composite/ComputedStringValue"
      start:
        "$ref": "#/$composite/ComputedNumberValue"
      count:
        "$ref": "#/$composite/ComputedNumberValue"
      end:
        "$ref": "#/$composite/ComputedNumberValue"
  TrimStringValue:
    title: Trim String Value
    description: Trims the surrounding whitespace or other characters from a string.
    type: object
    discriminator:
      propertyName: kind
    required:
      - source
      - kind
      - value
    additionalProperties: false
    properties:
      source:
        "$ref": "#/$defs/Source"
      kind:
        const: trim-string
        type: string
      value:
        "$ref": "#/$composite/ComputedStringValue"
      "trim-chars":
        "$ref": "#/$composite/ComputedStringValue"
  NumberToStringValue:
    title: Number to String Value
    description: A string value that is the string representation of a number.
    type: object
    discriminator:
      propertyName: kind
    required:
      - source
      - kind
      - value
    additionalProperties: false
    "$comment": >
      We may want to expand the format into an explicit definition so it does
      not require additional parsing.  At the moment, this is the Rust format! string,
      and only takes a constant string as the formatter.
    properties:
      source:
        "$ref": "#/$defs/Source"
      kind:
        const: number-to-string
        type: string
      value:
        "$ref": "#/$composite/ComputedNumberValue"
      format:
        "$ref": "#/$defs/ConstantStringValue"
  BooleanToStringValue:
    title: Boolean to String Value
    description: A string value that is the string representation of a boolean.
    type: object
    discriminator:
      propertyName: kind
    required:
      - source
      - kind
      - value
    additionalProperties: false
    properties:
      source:
        "$ref": "#/$defs/Source"
      kind:
        const: boolean-to-string
        type: string
      value:
        "$ref": "#/$composite/ComputedBooleanValue"
      "true-string":
        "$ref": "#/$composite/ComputedStringValue"
      "false-string":
        "$ref": "#/$composite/ComputedStringValue"
  ListToStringValue:
    title: List to String Value
    description: >
      A string value that is the string representation of a list.  If no separator is given, this
      defaults to ', '.
    type: object
    discriminator:
      propertyName: kind
    required:
      - source
      - kind
      - value
    additionalProperties: false
    properties:
      source:
        "$ref": "#/$defs/Source"
      kind:
        const: list-to-string
        type: string
      value:
        "$ref": "#/$composite/ComputedStringListValue"
      separator:
        "$ref": "#/$composite/ComputedStringValue"
  MapToStringValue:
    title: Map to String Value
    description: >
      A string value that is the string representation of a map.
      The key-separator defaults to '=', and the item-separator defaults to ', '.
    type: object
    discriminator:
      propertyName: kind
    required:
      - source
      - kind
      - value
    additionalProperties: false
    properties:
      source:
        "$ref": "#/$defs/Source"
      kind:
        const: map-to-string
        type: string
      value:
        "$ref": "#/$composite/ComputedStringMapValue"
      "key-separator":
        "$ref": "#/$composite/ComputedStringValue"
      "item-separator":
        "$ref": "#/$composite/ComputedStringValue"
  ConstantStringValue:
    title: Constant String Value
    description: A constant string value.
    type: object
    discriminator:
      propertyName: kind
    required:
      - source
      - kind
      - value
    additionalProperties: false
    properties:
      source:
        "$ref": "#/$defs/Source"
      kind:
        const: constant-string
        type: string
      value:
        type: string
        description: The constant string value.

