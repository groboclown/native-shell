        "$ref": "#/$defs/JobRef"
      name:
        "$ref": "#/$defs/ParamName"
  RangeStringMapListValue:
    title: Range String Map List Value
    description: >
      Selects a sub-sequence of values from an array.  If the 'count'
      or 'end' fields are not given, then it defaults to the end of the
      list.  If the 'start' field is not given, then it defaults to 0.
    type: object
    discriminator:
      propertyName: kind
    required:
      - kind
      - source
      - list
    additionalProperties: false
    properties:
      kind:
        const: range-string-map-list
        type: string
      source:
        "$ref": "#/$defs/Source"
      list:
        "$ref": "#/$composite/ComputedStringMapListValue"
      start:
        "$ref": "#/$composite/ComputedNumberValue"
      count:
        "$ref": "#/$composite/ComputedNumberValue"
      end:
        "$ref": "#/$composite/ComputedNumberValue"
  ConstantStringMapListValue:
    title: Constant String-Map List Value
    description: A constant string-map list value.  Can include expanding a sub-list within the list.
    type: object
    discriminator:
      propertyName: kind
    required:
      - kind
      - source
      - value
    additionalProperties: false
    properties:
      kind:
        const: constant-string-map-list
        type: string
      source:
        "$ref": "#/$defs/Source"
      value:
        type: array
        description: The constant string-map list value.
        items:
          oneOf:
            - "$ref": "#/$composite/ComputedStringMapValue"
            - "$ref": "#/$composite/ComputedStringMapListValue"

$composite:
  # Categories of values.
  # The build.rs has special handlers to flatten these out inside of arrays.
  # This allows for building up multiple categories, like the
  # CalculatedValue which contains multiple categories, each with their own
  # collection, and be flattened into a single enum in Rust.
  ComputedStringValue:
    title: Computed String Value
    description: A computed string value.
    oneOf:
      - "$ref": "#/$defs/LookupStringValue"
      - "$ref": "#/$defs/ListIndexStringValue"
      - "$ref": "#/$defs/MapKeyStringValue"
      - "$ref": "#/$defs/SubStringValue"
      - "$ref": "#/$defs/TrimStringValue"
      - "$ref": "#/$defs/NumberToStringValue"
      - "$ref": "#/$defs/BooleanToStringValue"
      - "$ref": "#/$defs/ListToStringValue"
      - "$ref": "#/$defs/MapToStringValue"
      - "$ref": "#/$defs/ConstantStringValue"
  ComputedNumberValue:
    title: Computed Number Value
    description: A computed number value.
    oneOf:
      - "$ref": "#/$defs/LookupNumberValue"
      - "$ref": "#/$defs/AddTwoValues"
      - "$ref": "#/$defs/SubtractTwoValues"
      - "$ref": "#/$defs/MultiplyTwoValues"
      - "$ref": "#/$defs/DivideTwoValues"
      - "$ref": "#/$defs/ModulusTwoValues"
      - "$ref": "#/$defs/PowerTwoValues"
      - "$ref": "#/$defs/RoundValue"
      - "$ref": "#/$defs/FloorValue"
      - "$ref": "#/$defs/CeilValue"
      - "$ref": "#/$defs/AbsValue"
      - "$ref": "#/$defs/SumNumberListValue"
      - "$ref": "#/$defs/ProductNumberListValue"
      - "$ref": "#/$defs/AverageNumberListValue"
      - "$ref": "#/$defs/MinNumberListValue"
      - "$ref": "#/$defs/MaxNumberListValue"
      - "$ref": "#/$defs/ListIndexNumberValue"
      - "$ref": "#/$defs/MapKeyNumberValue"
      - "$ref": "#/$defs/CollectionSizeNumberValue"
      - "$ref": "#/$defs/StringLeftIndexNumberValue"
      - "$ref": "#/$defs/StringRightIndexNumberValue"
      - "$ref": "#/$defs/StringListIndexNumberValue"
      - "$ref": "#/$defs/NumberListIndexNumberValue"
      - "$ref": "#/$defs/BooleanListIndexNumberValue"
      - "$ref": "#/$defs/ConstantNumberValue"
  ComputedBooleanValue:
    title: Computed Boolean Value
    description: A computed boolean value.
    oneOf:
      - "$ref": "#/$defs/LookupBooleanValue"
      - "$ref": "#/$defs/AndTwoBooleanValues"
      - "$ref": "#/$defs/OrTwoBooleanValues"
      - "$ref": "#/$defs/NotBooleanValue"
      - "$ref": "#/$defs/XorTwoBooleanValues"
      - "$ref": "#/$defs/NandTwoBooleanValues"
      - "$ref": "#/$defs/NorTwoBooleanValues"
      - "$ref": "#/$defs/XnorTwoBooleanValues"
      - "$ref": "#/$defs/ListIndexBooleanValue"
      - "$ref": "#/$defs/MapKeyBooleanValue"
      - "$ref": "#/$defs/MapContainsKeyBooleanValue"
      - "$ref": "#/$defs/ListContainsIndexBooleanValue"
      - "$ref": "#/$defs/StringEqualBooleanValue"
      - "$ref": "#/$defs/NumberEqualBooleanValue"
      - "$ref": "#/$defs/ConstantBooleanValue"
  ComputedStringListValue:
    title: Computed List Value
    description: A computed list value.
    oneOf:
      - "$ref": "#/$defs/LookupStringListValue"
      - "$ref": "#/$defs/SplitStringValue"
      - "$ref": "#/$defs/RangeStringListValue"
      - "$ref": "#/$defs/StringListMapKeyValue"
      - "$ref": "#/$defs/MapKeysStringListValue"
      - "$ref": "#/$defs/ConstantStringListValue"
      # Note: operations like 'sort' and 'unique' belong in jobs.
  ComputedNumberListValue:
    title: Computed List Value
    description: A computed list value.
    oneOf:
      - "$ref": "#/$defs/LookupNumberListValue"
      - "$ref": "#/$defs/RangeNumberListValue"
      - "$ref": "#/$defs/ConstantNumberListValue"
      # TODO include 'contains-number'
  ComputedBooleanListValue:
    title: Computed List Value
    description: A computed list value.
    oneOf:
      - "$ref": "#/$defs/LookupBooleanListValue"
      - "$ref": "#/$defs/RangeBooleanListValue"
      - "$ref": "#/$defs/ConstantBooleanListValue"
      # TODO include 'contains-boolean'
  ComputedStringMapValue:
    title: Computed Map Value
    description: A computed map value.
    oneOf:
      - "$ref": "#/$defs/LookupStringMapValue"
      - "$ref": "#/$defs/UnionStringMapValue"
      - "$ref": "#/$defs/StringMapListIndexValue"
      - "$ref": "#/$defs/ConstantStringMapValue"
      # TODO include 'contains-key-string-map' and 'contains-value-string-map'
  ComputedNumberMapValue:
    title: Computed Map Value
    description: A computed map value.
    oneOf:
      - "$ref": "#/$defs/LookupNumberMapValue"
      - "$ref": "#/$defs/UnionNumberMapValue"
      - "$ref": "#/$defs/ConstantNumberMapValue"
  ComputedBooleanMapValue:
    title: Computed Map Value
    description: A computed map value.
    oneOf:
      - "$ref": "#/$defs/LookupBooleanMapValue"
      - "$ref": "#/$defs/UnionBooleanMapValue"
      - "$ref": "#/$defs/ConstantBooleanMapValue"
      # TODO add 'only-true-boolan-map' and 'only-false-boolean-map'
  ComputedStringListMapValue:
    title: Computed String List Map Value
    description: Contains a map that contains string-list as the value.
    oneOf:
      - "$ref": "#/$defs/LookupStringListMapValue"
      - "$ref": "#/$defs/UnionStringListMapValue"
      - "$ref": "#/$defs/ConstantStringListMapValue"
  ComputedStringMapListValue:
    title: Computed String Map List Value
    description: Contains a list of string-maps.
    oneOf:
      - "$ref": "#/$defs/LookupStringMapListValue"
      - "$ref": "#/$defs/RangeStringMapListValue"
      - "$ref": "#/$defs/ConstantStringMapListValue"
