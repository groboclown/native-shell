# Shell that shows off multiple node groups by having streams
# spread across nodes.

schema-version: "1.0.0"

version: "1.0.0"
source:
  file: "tee-merge.ns"
  line: 1
  column: 1
events:
  - name: start
    text: "Start of the shell script execution."
    type: signal
    source:
      file: "script.ns"
      line: 1
      column: 1
  # Built-in events used by modules.
  - name: trace
    text: "Trace event, used by modules to report debug information."
    source:
      file: "built-in"
      line: 0
      column: 0
  - name: debug
    text: "Debug event, used by modules to report debug information."
    source:
      file: "built-in"
      line: 0
      column: 0
  - name: info
    text: "Informative event, used by modules to report debug information."
    source:
      file: "built-in"
      line: 0
      column: 0

nodes:
  # The main node.  It must use a module that conforms to the builder's requirements.
  - name: main
    source:
      file: "script.ns"
      line: 1
      column: 1
    module: shell
    initial-parameters:
      description:
        source:
          file: "script.ns"
          line: 1
          column: 1
        value:
          source:
            file: "script.ns"
            line: 1
            column: 1
          type: string
          value: "Sends the contents of files and text and stdin into stdout."
      version:
        source:
          file: "script.ns"
          line: 1
          column: 1
        value:
          source:
            file: "script.ns"
            line: 1
            column: 1
          type: string
          value: "1.0.0"
      start_event:
        source:
          file: "script.ns"
          line: 1
          column: 1
        value:
          source:
            file: "script.ns"
            line: 1
            column: 1
          type: string
          value: "start"
      required_value_parameters:
        source:
          file: "script.ns"
          line: 1
          column: 1
        value:
          source:
            file: "script.ns"
            line: 1
            column: 1
          type: string-list
          value: 
            - file1
            - file2
            - text1
            - text2
      usage_line:
        source:
          file: "script.ns"
          line: 1
          column: 1
        value:
          source:
            file: "script.ns"
            line: 1
            column: 1
          type: string
          value: "--file1=SOURCE --file2=SOURCE --text1=TEXT --text2=TEXT"
      parameter_help:
        source:
          file: "script.ns"
          line: 1
          column: 1
        value:
          source:
            file: "script.ns"
            line: 1
            column: 1
          type: string-map
          value:
            "--file1": (required) The file to read from.
            "--file2": (required) The file to read from.
            "--text1": (required) Text to use as a source.
            "--text2": (required) Text to use as a source.
      end_help:
        source:
          file: "script.ns"
          line: 1
          column: 1
        value:
          source:
            file: "script.ns"
            line: 1
            column: 1
          type: string-list
          value: 
            - Performs merge of five pieces of data across multiple manipulations (stdin is also read).  Uses '+' as a record separator.
    runtime-parameters: []
    exit-actions: []
    streams:
      - name: stdin
        source:
          file: "script.ns"
          line: 1
          column: 1
        mode: output
        to-node: merge1
        to-stream: input
    event-listeners:
      # The CLI action to run, as specified by the start_event field.
      - name: start
        source:
          file: "script.ns"
          line: 1
          column: 1
        actions:
          # Runs the data_file_1 node.
          # This implicitly triggers all nodes in its stream graph.
          - name: "Data 1"
            source:
              file: "script.ns"
              line: 1
              column: 1
            run:
              source:
                file: "script.ns"
                line: 1
                column: 1
              type: spawn-node
              node: data_file_1

  # The nodes are intentionally built with an "interesting" structure.
  # Note that main has a single stdout, which means it needs a merge node for all
  # outputs to it.
  # Because of the special cases with the main module (such as no exec function), likewise
  # its streams are carefully handled.  They end up being 'dup2' to simulate the required behavior.
  # Note that if they share the main's FD, that does not mean they then belong to the same node group.
  #
  # The below nodes makes:
  #
  #                          +----------------+
  #                          |                |
  #   stdout   <- merge3   <-+ merge1   <-+ <-+ tee1   <- file1 (as data_file_1)
  #                          |            + text1 (as data_text_1)
  #                          + merge2   <-+ file2 (as data_file_2)
  #                                       + text2 (as data_text_2)
  #                                       + stdin

  - name: data_file_1
    source:
      file: "script.ns"
      line: 2
      column: 1
    module: cat
    initial-parameters: {}
    runtime-parameters:
      - name: filenames
        source:
          file: "script.ns"
          line: 2
          column: 1
        value:
          type: constant-string-list
          source:
            file: "script.ns"
            line: 2
            column: 1
          value:
            - type: map-key-string
              source:
                file: "script.ns"
                line: 2
                column: 1
              map:
                source:
                  file: "script.ns"
                  line: 2
                  column: 1
                type: lookup-string-map
                node:
                  source:
                    file: "script.ns"
                    line: 2
                    column: 1
                  type: constant-string
                  value: main
                name:
                  source:
                    file: "script.ns"
                    line: 2
                    column: 1
                  type: constant-string
                  value: value_params
              key:
                type: constant-string
                source:
                  file: "script.ns"
                  line: 2
                  column: 1
                value: "file1"
              default:
                type: constant-string
                source:
                  file: "script.ns"
                  line: 2
                  column: 1
                value: ""
    exit-actions: []
    streams:
      - name: output
        source:
          file: "script.ns"
          line: 2
          column: 1
        mode: output
        to-node: tee1
        to-stream: input
    event-listeners: []

  - name: data_file_2
    source:
      file: "script.ns"
      line: 3
      column: 1
    module: cat
    initial-parameters: {}
    runtime-parameters:
      - name: filenames
        source:
          file: "script.ns"
          line: 3
          column: 1
        value:
          type: constant-string-list
          source:
            file: "script.ns"
            line: 3
            column: 1
          value:
            - type: map-key-string
              source:
                file: "script.ns"
                line: 3
                column: 1
              map:
                source:
                  file: "script.ns"
                  line: 3
                  column: 1
                type: lookup-string-map
                node:
                  source:
                    file: "script.ns"
                    line: 3
                    column: 1
                  type: constant-string
                  value: main
                name:
                  source:
                    file: "script.ns"
                    line: 3
                    column: 1
                  type: constant-string
                  value: value_params
              key:
                type: constant-string
                source:
                  file: "script.ns"
                  line: 3
                  column: 1
                value: "file2"
              default:
                type: constant-string
                source:
                  file: "script.ns"
                  line: 3
                  column: 1
                value: ""
    exit-actions: []
    streams:
      - name: output
        source:
          file: "script.ns"
          line: 3
          column: 1
        mode: output
        to-node: merge2
        to-stream: input
    event-listeners: []

  - name: data_text_1
    source:
      file: "script.ns"
      line: 4
      column: 1
    module: echo
    initial-parameters: {}
    runtime-parameters:
      - name: text
        source:
          file: "script.ns"
          line: 4
          column: 1
        value:
          type: map-key-string
          source:
            file: "script.ns"
            line: 4
            column: 1
          map:
            source:
              file: "script.ns"
              line: 4
              column: 1
            type: lookup-string-map
            node:
              source:
                file: "script.ns"
                line: 4
                column: 1
              type: constant-string
              value: main
            name:
              source:
                file: "script.ns"
                line: 4
                column: 1
              type: constant-string
              value: value_params
          key:
            type: constant-string
            source:
              file: "script.ns"
              line: 4
              column: 1
            value: "text1"
          default:
            type: constant-string
            source:
              file: "script.ns"
              line: 4
              column: 1
            value: ""
    exit-actions: []
    streams:
      - name: output
        source:
          file: "script.ns"
          line: 4
          column: 1
        mode: output
        to-node: merge1
        to-stream: input
    event-listeners: []

  - name: data_text_2
    source:
      file: "script.ns"
      line: 5
      column: 1
    module: echo
    initial-parameters: {}
    runtime-parameters:
      - name: text
        source:
          file: "script.ns"
          line: 5
          column: 1
        value:
          type: map-key-string
          source:
            file: "script.ns"
            line: 5
            column: 1
          map:
            source:
              file: "script.ns"
              line: 5
              column: 1
            type: lookup-string-map
            node:
              source:
                file: "script.ns"
                line: 5
                column: 1
              type: constant-string
              value: main
            name:
              source:
                file: "script.ns"
                line: 5
                column: 1
              type: constant-string
              value: value_params
          key:
            type: constant-string
            source:
              file: "script.ns"
              line: 5
              column: 1
            value: "text2"
          default:
            type: constant-string
            source:
              file: "script.ns"
              line: 5
              column: 1
            value: ""
    exit-actions: []
    streams:
      - name: output
        source:
          file: "script.ns"
          line: 5
          column: 1
        mode: output
        to-node: merge2
        to-stream: input
    event-listeners: []

  - name: tee1
    source:
      file: "script.ns"
      line: 6
      column: 1
    module: tee
    initial-parameters: {}
    runtime-parameters: []
    exit-actions: []
    event-listeners: []
    streams:
      - name: output
        source:
          file: "script.ns"
          line: 6
          column: 1
        mode: output
        to-node: merge1
        to-stream: input
      - name: output
        source:
          file: "script.ns"
          line: 6
          column: 1
        mode: output
        to-node: merge3
        to-stream: input

  - name: merge1
    source:
      file: "script.ns"
      line: 7
      column: 1
    module: merge
    initial-parameters: {}
    runtime-parameters:
      - name: separator
        source:
          file: "script.ns"
          line: 7
          column: 1
        value:
          type: constant-string
          source:
            file: "script.ns"
            line: 7
            column: 1
          value: "+"
    exit-actions: []
    event-listeners: []
    streams:
      - name: output
        source:
          file: "script.ns"
          line: 7
          column: 1
        mode: output
        to-node: merge3
        to-stream: input

  - name: merge2
    source:
      file: "script.ns"
      line: 8
      column: 1
    module: merge
    initial-parameters: {}
    runtime-parameters:
      - name: separator
        source:
          file: "script.ns"
          line: 8
          column: 1
        value:
          type: constant-string
          source:
            file: "script.ns"
            line: 8
            column: 1
          value: "+"
    exit-actions: []
    event-listeners: []
    streams:
      - name: output
        source:
          file: "script.ns"
          line: 8
          column: 1
        mode: output
        to-node: merge3
        to-stream: input

  - name: merge3
    source:
      file: "script.ns"
      line: 9
      column: 1
    module: merge
    initial-parameters: {}
    runtime-parameters:
      - name: separator
        source:
          file: "script.ns"
          line: 9
          column: 1
        value:
          type: constant-string
          source:
            file: "script.ns"
            line: 9
            column: 1
          value: "+"
    exit-actions: []
    event-listeners: []
    streams:
      - name: output
        source:
          file: "script.ns"
          line: 9
          column: 1
        mode: output
        to-node: main
        to-stream: stdout
