# Simple shell that performs 'cat' on a file, then pipes that into another file.
# Thus, it simulates a copy operation.

schema-version: "1.0.0"

version: "1.0.0"
source:
  file: "script.ns"
  line: 1
  column: 1
events:
  - name: start
    text: "Start of the shell script execution."
nodes:
  # The main node.  It must use a module that conforms to the builder's requirements.
  - name: main
    source:
      file: "script.ns"
      line: 1
      column: 1
    module: shell
    environment:
      source:
        file: "script.ns"
        line: 1
        column: 1
    initial-parameters:
      description: "Sends the contents of a file through a pipe into another file."
      version: "1.0.0"
      start_event: "start"
      end_help:
        - Passes streams through many commands.
    event-listeners:
      # The CLI action to run, as specified by the start_event field.
      - name: start
        source:
          file: "script.ns"
          line: 1
          column: 1
        actions: []
