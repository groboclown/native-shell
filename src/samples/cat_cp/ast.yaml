# Simple shell that performs 'cat' on a file, then pipes that into another file.
# Thus, it simulates a copy operation.

schema-version: "1.0.0"

version: "1.0.0"
source:
  file: "script.ns"
  line: 1
  column: 1
events:
  - name: start
    text: "Start of the shell script execution."
    source:
      file: "script.ns"
      line: 1
      column: 1
nodes:
  # The main node.  It must use a module that conforms to the builder's requirements.
  - name: main
    source:
      file: "script.ns"
      line: 1
      column: 1
    module: shell
    initial-parameters:
      description:
        source:
          file: "script.ns"
          line: 1
          column: 1
        value:
          source:
            file: "script.ns"
            line: 1
            column: 1
          type: string
          value: "Sends the contents of a file through a pipe into another file."
      version:
        source:
          file: "script.ns"
          line: 1
          column: 1
        value:
          source:
            file: "script.ns"
            line: 1
            column: 1
          type: string
          value: "1.0.0"
      start_event:
        source:
          file: "script.ns"
          line: 1
          column: 1
        value:
          source:
            file: "script.ns"
            line: 1
            column: 1
          type: string
          value: "start"
      required_value_parameters:
        source:
          file: "script.ns"
          line: 1
          column: 1
        value:
          source:
            file: "script.ns"
            line: 1
            column: 1
          type: string-list
          value: 
            - source
            - target
      usage_line:
        source:
          file: "script.ns"
          line: 1
          column: 1
        value:
          source:
            file: "script.ns"
            line: 1
            column: 1
          type: string
          value: "--source=SOURCE --target=TARGET"
      parameter_help:
        source:
          file: "script.ns"
          line: 1
          column: 1
        value:
          source:
            file: "script.ns"
            line: 1
            column: 1
          type: string-map
          value:
            "--source": (required) The file to read from.
            "--target": (required) The file to write to.
      end_help:
        source:
          file: "script.ns"
          line: 1
          column: 1
        value:
          source:
            file: "script.ns"
            line: 1
            column: 1
          type: string-list
          value: 
            - Copies the contents of the source file to the target file.
            - It does not create directories, but will overwrite the target file if it exists.
    exit-actions: []
    runtime-parameters: []
    streams: []
    event-listeners:
      # The CLI action to run, as specified by the start_event field.
      - name: start
        source:
          file: "script.ns"
          line: 1
          column: 1
        actions:
          - name: "Script execution"
            source:
              file: "script.ns"
              line: 1
              column: 1
            run:
              source:
                file: "script.ns"
                line: 1
                column: 1
              type: spawn-node
              node: cat
  - name: cat
    source:
      file: "script.ns"
      line: 1
      column: 1
    module: cat
    initial-parameters: {}
    runtime-parameters:
      - name: filenames
        source:
          file: "script.ns"
          line: 1
          column: 1
        value:
          type: constant-string-list
          source:
            file: "script.ns"
            line: 1
            column: 1
          value:
            - type: map-key-string
              source:
                file: "script.ns"
                line: 1
                column: 1
              map:
                source:
                  file: "script.ns"
                  line: 1
                  column: 1
                type: lookup-string-map
                node:
                  source:
                    file: "script.ns"
                    line: 1
                    column: 1
                  type: constant-string
                  value: main
                name:
                  source:
                    file: "script.ns"
                    line: 1
                    column: 1
                  type: constant-string
                  value: value_params
              key:
                type: constant-string
                source:
                  file: "script.ns"
                  line: 1
                  column: 1
                value: "source"
              default:
                type: constant-string
                source:
                  file: "script.ns"
                  line: 1
                  column: 1
                value: ""
    exit-actions: []
    streams:
      - name: output
        source:
          file: "script.ns"
          line: 1
          column: 1
        mode: output
        to-node: output
        to-stream: input
    event-listeners: []

  - name: output
    source:
      file: "script.ns"
      line: 1
      column: 1
    module: file_sink
    initial-parameters: {}
    runtime-parameters:
      - name: filename
        source:
          file: "script.ns"
          line: 1
          column: 1
        value:
          type: map-key-string
          source:
            file: "script.ns"
            line: 1
            column: 1
          map:
            source:
              file: "script.ns"
              line: 1
              column: 1
            type: lookup-string-map
            node:
              source:
                file: "script.ns"
                line: 1
                column: 1
              type: constant-string
              value: main
            name:
              source:
                file: "script.ns"
                line: 1
                column: 1
              type: constant-string
              value: value_params
          key:
            type: constant-string
            source:
              file: "script.ns"
              line: 1
              column: 1
            value: "target"
          default:
            type: constant-string
            source:
              file: "script.ns"
              line: 1
              column: 1
            value: ""
      - name: append
        source:
          file: "script.ns"
          line: 1
          column: 1
        value:
          type: constant-boolean
          source:
            file: "script.ns"
            line: 1
            column: 1
          value: false
    exit-actions: []
    streams: []
    event-listeners: []
